function session(){return state.sessions.find(s=>s.id===state.active)||state.sessions[0]}
function rawOf(t,where){return where?.[t.id]||{}}
function fieldsValid(t,values){if(!values)return null;const nums={};for(const f of t.fields){const n=numRaw(values[f.key]);if(n===null||n<0||!Number.isFinite(n))return null;if(f.kind==='int'&&!Number.isInteger(n))return null;if(f.kind==='select'&&!f.options.some(o=>o[0]===n))return null;nums[f.key]=n}return nums}
function score(t,where){const v=fieldsValid(t,rawOf(t,where));if(v===null)return null;const sum=v.left!==undefined&&v.right!==undefined?v.left+v.right:null;let p=null;
 switch(t.id){
 case 'side':p=sum<=24?0:sum>=72?4:round2(.1+(sum-25)/12);break;
 case 'star':{const sec=Math.round(v.time*10)/10;p=sec<=20.9?4:sec>=30.1?0:round2(4-(sec-20.9)*3/7);break}
 case 'beep':p=v.count<=20?round2(v.count*.05):v.count>=90?8:round2(1+(v.count-20)*.1);break;
 case 'push':p=v.count===0?0:v.count>=48?3:round2(.5+(v.count-1)*2.5/47);break;
 case 'five':{const m=Math.round(v.distance*100)/100;p=m<7.5?0:m>=10.8?2.5:round2(.5+(m-7.5)*2/3.3);break}
 case 'long':{const m=Math.round(v.distance*100)/100;p=m<1?0:m>=2.2?2.5:round2(.5+(m-1)*2/1.2);break}
 case 'gym':p=Number.isInteger(v.deductions)&&v.deductions<=16?4-v.deductions*.25:null;break;
 case 'rhythm':p=round2(v.tempo+v.quality);break;
 case 'leg':p=round2(sum);break;
 case 'squat':case 'bridge':p=v.grade;break;
 case 'throw':p=sum>=19?8:round2(sum*.4);break;
 case 'school':p=v.score<=8?round2(v.score):null;break;
 }
 return p==null?null:Math.max(0,Math.min(t.max,p));
}
const tBy=id=>TESTS.find(t=>t.id===id);
function resultLabel(t,where){const v=fieldsValid(t,rawOf(t,where));if(!v)return '–';if(t.id==='side'||t.id==='throw')return intfmt(v.left+v.right)+' '+t.unit;if(t.id==='rhythm'||t.id==='leg')return fmt(Object.values(v).reduce((a,b)=>a+b,0),2)+' p';if(t.id==='gym')return v.deductions+' väh.';if(['squat','bridge','school'].includes(t.id))return fmt(Object.values(v)[0])+' p';const n=Object.values(v)[0];return (t.id==='star'?fmt(Math.round(n*10)/10,1):['five','long'].includes(t.id)?fmt(Math.round(n*100)/100,2):intfmt(n))+' '+t.unit}
function catScore(cat,where){const ts=TESTS.filter(t=>t.cat===cat);const vals=ts.map(t=>score(t,where));return {points:vals.every(x=>x!==null)?round2(vals.reduce((a,b)=>a+b,0)):null,done:vals.filter(x=>x!==null).length,total:ts.length}}
function totalScore(where,school=state.school){const arr=CAT.map(c=>catScore(c.id,where).points);if(arr.some(x=>x===null))return null;if(!school)return round2(arr.reduce((a,b)=>a+b,0));const sc=score(tBy('school'),where);if(sc==null)return null;return round2(arr.reduce((a,b)=>a+b,0)-Math.min(...arr)+sc)}
function completion(where,school=state.school){const ts=TESTS.filter(t=>school||t.id!=='school');return {done:ts.filter(t=>score(t,where)!==null).length,total:ts.length}}

 const priorities=[];for(const t of TESTS.filter(t=>state.school||t.id!=='school')){const curr=score(t,s.results),target=score(t,state.goals);if(curr!==null&&target!==null){const delta=round2(target-curr);if(delta>0){const min=Number(state.efforts[t.id]);priorities.push({t,delta,roi:min>0?delta/(8*min/60):null})}}}

function fieldInput(f,scope,t){const vals=scope==='current'?rawOf(t,session().results):goalsFor(t),value=vals[f.key]??'';const common=`data-scope="${scope}" data-test="${t.id}" data-field="${f.key}"`;
 if(f.kind==='select')return `<div class="field"><label>${esc(f.label)}</label><select class="control" ${common}><option value="">– Ei arvioitu –</option>${f.options.map(o=>`<option value="${o[0]}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])} (${fmt(o[0])} p.)</option>`).join('')}</select></div>`;
 const decimal=f.kind==='decimal';return `<div class="field"><label>${esc(f.label)}</label><input class="control" ${common} type="text" inputmode="${decimal?'decimal':'numeric'}" autocomplete="off" placeholder="${decimal?'esim. '+(t.id==='star'?'25,4':'8,45'):'esim. 12'}" value="${esc(value)}"></div>`

function scoringTable(t){const result=[];const R=(label,value)=>result.push([String(label),fmt(value)]);
 switch(t.id){
 case 'side':R('0–24',0);for(let n=25;n<72;n++)R(n,score(t,{side:{right:n,left:0}}));R('72 tai enemmän',4);break;
 case 'star':R('20,9 s tai alle',4);for(let i=210;i<=300;i++)R(fmt(i/10,1)+' s',score(t,{star:{time:i/10}}));R('30,1 s tai enemmän',0);break;
 case 'beep':for(let n=0;n<90;n++)R(n,score(t,{beep:{count:n}}));R('90 tai enemmän',8);break;
 case 'push':for(let n=0;n<48;n++)R(n,score(t,{push:{count:n}}));R('48 tai enemmän',3);break;
 case 'five':R('Alle 7,50 m',0);for(let cm=750;cm<1080;cm++)R(fmt(cm/100,2)+' m',score(t,{five:{distance:cm/100}}));R('10,80 m tai enemmän',2.5);break;
 case 'long':R('Alle 1,00 m',0);for(let cm=100;cm<220;cm++)R(fmt(cm/100,2)+' m',score(t,{long:{distance:cm/100}}));R('2,20 m tai enemmän',2.5);break;
 case 'gym':for(let i=0;i<=16;i++)R(i,4-i*.25);break;
 case 'rhythm':return '<p class="hint">Kummankin osion (rytmi/tempo sekä liikkeiden laatu) pisteet valitaan erikseen. Osiot lasketaan yhteen (maksimi 4 p.).</p>'+RHYTHM.map(o=>`<div class="row-item"><span>${esc(o[1])}</span><strong>${fmt(o[0])}</strong></div>`).join('');
 case 'leg':return '<p class="hint">Molemmat jalat pisteytetään erikseen (maksimi 1,25 p./jalka).</p>'+LEG.map(o=>`<div class="row-item"><span>${esc(o[1])}</span><strong>${fmt(o[0])}</strong></div>`).join('');
 case 'squat':case 'bridge':return t.fields[0].options.map(o=>`<div class="row-item"><span>${esc(o[1])}</span><strong>${fmt(o[0])}</strong></div>`).join('');
 case 'throw':for(let i=0;i<19;i++)R(i,round2(i*.4));R('19 tai enemmän',8);break;
 case 'school':return '<p class="hint">Koulukohtaiselle osuudelle ei ole valtakunnallista tulos–piste-taulukkoa. Käytä hakukoulun vahvistamaa arviointia.</p>';
 }
 return `<div class="tablewrap"><table class="scoretable"><thead><tr><th>${t.id==='star'?'Aika':t.id==='gym'?'Vähennykset':'Tulos'}</th><th>Pisteet</th></tr></thead><tbody>${result.map(([v,p])=>`<tr><td>${esc(v)}</td><td>${p}</td></tr>`).join('')}</tbody></table></div>`
}

function practiceDayObject(date){const v=state.practice[date];return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}
function checkedCount(date){const entry=practiceDayObject(date);return PRACTICE_ITEMS.reduce((n,t)=>n+(entry[t.key]===true?1:0),0)}
function shiftPracticeDay(k,delta){const [y,m,d]=k.split('-').map(Number);const day=new Date(y,m-1,d,12);day.setDate(day.getDate()+delta);return dayKey(day)}
function weekPracticeKeys(k){const [y,m,d]=k.split('-').map(Number),day=new Date(y,m-1,d,12),offset=(day.getDay()+6)%7;day.setDate(day.getDate()-offset);return Array.from({length:7},(_,i)=>shiftPracticeDay(dayKey(day),i))}
function recentPracticeKeys(days){return Array.from({length:days},(_,i)=>shiftPracticeDay(dayKey(),i-days+1))}
function practiceCountIn(keys,item){return keys.reduce((sum,date)=>sum+(practiceDayObject(date)[item.key]===true?1:0),0)}
function choosePracticeDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>dayKey())return;const [y,m,d]=date.split('-').map(Number),dt=new Date(y,m-1,d,12);if(dayKey(dt)!==date)return;practiceDate=date;renderPractice()}
function setPracticeCheck(id,checked){if(practiceDate>dayKey()||!PRACTICE_ITEMS.some(t=>t.key===id))return;const entry={...practiceDayObject(practiceDate)};if(checked)entry[id]=true;else delete entry[id];if(Object.keys(entry).length)state.practice[practiceDate]=entry;else delete state.practice[practiceDate];persist();renderPractice()}
function renderPractice(){
 if(practiceDate>dayKey())practiceDate=dayKey();
 const n=PRACTICE_ITEMS.length,today=dayKey(),count=checkedCount(practiceDate),week=weekPracticeKeys(practiceDate),last28=recentPracticeKeys(28),allDates=Object.keys(state.practice).filter(k=>checkedCount(k)>0),weekCount=week.reduce((v,k)=>v+checkedCount(k),0),activeWeekDays=week.filter(k=>checkedCount(k)>0).length,markCount=allDates.reduce((v,k)=>v+checkedCount(k),0),active28=last28.filter(k=>checkedCount(k)>0).length;
 const isToday=practiceDate===today;
 let html=`<div class="section-head"><h2>Harjoitukset</h2><span class="pill">${n} harjoitetta</span></div>`;
 html+=`<p class="hint">T\u00e4pp\u00e4\u00e4 harjoiteltu testi kerran p\u00e4iv\u00e4ss\u00e4. Kaikkia testej\u00e4 ei tarvitse tehd\u00e4 joka p\u00e4iv\u00e4. Kuittaus tallentuu heti.</p>`;
 html+=`<article class="card hero"><div class="split"><div><div class="smallcap">${isToday?'T\u00e4n\u00e4\u00e4n':'Valittu p\u00e4iv\u00e4'} \u00b7 ${esc(dateFi(practiceDate))}</div><div class="bigscore">${count} <span>/ ${n}</span></div></div><span class="pill ${count===n?'good':count>0?'warn':''}">${count===n?'Kaikki tehty!':count===0?'Ei merkint\u00f6j\u00e4':'Harjoiteltu'}</span></div>${bar(count,n)}<div class="practice-datebar"><button class="btn" id="practicePrev" type="button" aria-label="Edellinen p\u00e4iv\u00e4">\u2039</button><input class="control" type="date" id="practiceDate" max="${today}" value="${practiceDate}" aria-label="Harjoitusp\u00e4iv\u00e4"><button class="btn" id="practiceNext" type="button" aria-label="Seuraava p\u00e4iv\u00e4" ${isToday?'disabled':''}>\u203a</button></div>${!isToday?'<button class="btn small primary" id="practiceToday" type="button">Takaisin t\u00e4h\u00e4n p\u00e4iv\u00e4\u00e4n</button>':''}</article>`;
 html+=`<article class="card"><h3 class="h2">P\u00e4iv\u00e4n harjoitukset</h3>`;
 for(const cat of CAT){const items=PRACTICE_ITEMS.filter(t=>t.cat===cat.id),done=items.filter(t=>practiceDayObject(practiceDate)[t.key]===true).length;
 html+=`<div class="practice-group"><div class="practice-group-heading"><div>${CAT.findIndex(c=>c.id===cat.id)+1}. ${esc(cat.name)}</div><span>${done}/${items.length}</span></div>`;
 for(const item of items){const isChecked=practiceDayObject(practiceDate)[item.key]===true;
 html+=`<label class="practice-row ${isChecked?'is-done':''}"><input type="checkbox" data-practice-check="${esc(item.key)}" ${isChecked?'checked':''}><span class="practice-name">${esc(item.name)}</span></label>`}
 html+='</div>';
 }
 html+=`<div class="row-actions"><button class="btn small ghost" type="button" id="practiceClear" ${count===0?'disabled':''}>Tyhjenn\u00e4 p\u00e4iv\u00e4n merkinn\u00e4t</button></div><p class="practice-instructions">Merkint\u00e4 kertoo vain, ett\u00e4 harjoittelit kyseist\u00e4 testi\u00e4. Mittaustulos ja viralliset pisteet kirjataan erikseen Testit-v\u00e4lilehdell\u00e4.</p></article>`;
 html+=`<div class="section-head"><h2>Harjoittelun seuranta</h2><span class="hint">${esc(dateFi(week[0]))}\u2013${esc(dateFi(week[6]))}</span></div>`;
 html+=`<article class="card"><h3 class="h2">Viikkon\u00e4kym\u00e4</h3><div class="practice-week">${week.map((k,i)=>{const v=checkedCount(k);return `<button type="button" data-practice-day="${k}" class="practice-week-day ${k===practiceDate?'selected':''} ${k===today?'today':''}" ${k>today?'disabled':''}><small>${['Ma','Ti','Ke','To','Pe','La','Su'][i]} ${Number(k.slice(8))}.</small><strong>${v}</strong><em>/${n}</em></button>`}).join('')}</div><div class="practice-overview"><div class="stat"><div class="smallcap">Harjoiteltuja p\u00e4ivi\u00e4</div><strong>${activeWeekDays} / 7</strong></div><div class="stat"><div class="smallcap">Viikon kuittauksia</div><strong>${weekCount}</strong></div></div><p class="practice-caption">Valitse kalenterista p\u00e4iv\u00e4 tarkistaaksesi sen merkinn\u00e4t. Kaikkia testej\u00e4 ei tarvitse harjoitella joka p\u00e4iv\u00e4.</p></article>`;
 html+=`<article class="card"><h3 class="h2">Harjoituskertojen tilastot</h3><div class="practice-overview"><div class="stat"><div class="smallcap">28 pv aktiivisia</div><strong>${active28}</strong></div><div class="stat"><div class="smallcap">Kaikki merkinn\u00e4t</div><strong>${markCount}</strong></div></div><p class="practice-caption">Harjoitusp\u00e4ivi\u00e4 koko seurannassa: ${allDates.length}. Yksi harjoite voidaan kuitata kerran p\u00e4iv\u00e4ss\u00e4.</p><div class="practice-tablehead"><div>Testi</div><b>7 pv</b><b>28 pv</b><b>Kaikki</b></div>`;
 const last7=recentPracticeKeys(7);
 for(const cat of CAT){html+=`<div class="practice-group-heading">${esc(cat.name)}</div>`;
 for(const item of PRACTICE_ITEMS.filter(t=>t.cat===cat.id)){
 const c7=practiceCountIn(last7,item),c28=practiceCountIn(last28,item),all=practiceCountIn(allDates,item);
 html+=`<div class="practice-summaryrow"><div class="practice-testname">${esc(item.name)}<div class="practice-graph"><div class="fill" style="width:${(c28/28*100).toFixed(1)}%"></div></div></div><b>${c7}</b><b>${c28}</b><b>${all}</b></div>`;
 }}
 html+=`<p class="practice-caption">7 pv ja 28 pv tarkoittavat liukuvaa jaksoa, joka p\u00e4\u00e4ttyy t\u00e4h\u00e4n p\u00e4iv\u00e4\u00e4n. Palkki kuvaa harjoiteltujen p\u00e4ivien osuutta 28 p\u00e4iv\u00e4st\u00e4.</p></article>`;
 html+=`<div class="footer">Harjoitusmerkinn\u00e4t tallentuvat samalla selaimella kuin testitulokset ja sis\u00e4ltyv\u00e4t Asetukset-v\u00e4lilehden JSON-varmuuskopioon.</div>`;
 el('view-practice').innerHTML=html;
}
// ===== END DAILY PRACTICE =====

let progressA=null,progressB=null;
function renderSettings(){const s=session();let html=`<div class="section-head"><h2>Testikerrat ja tallennus</h2></div><article class="card"><div class="smallcap">Valittu testikerta</div><div class="field" style="margin-top:12px"><label for="sessionName">Nimi</label><input class="control" id="sessionName" value="${esc(s.name)}" maxlength="70"></div><div class="field" style="margin-top:12px"><label for="sessionDate">Testipäivä</label><input class="control" id="sessionDate" type="date" value="${esc(s.date)}"></div><div class="field" style="margin-top:12px"><label for="sessionNotes">Muistiinpanot</label><textarea class="control" id="sessionNotes" rows="3" placeholder="esim. testipaikka, olosuhteet, palautuminen">${esc(s.notes||'')}</textarea></div><div class="row-actions"><button class="btn primary" id="saveSessionMeta">Tallenna tiedot</button><button class="btn" id="newSessionBtn">+ Uusi kierros</button></div><button class="btn danger" id="deleteSessionBtn" style="width:100%">Poista valittu testikerta</button><div class="notice">Testikierroksia voi luoda rajattomasti. Vanhan kierroksen tulokset säilyvät muuttumattomina, ellei niitä itse muokkaa tai poista.</div></article>`;
 html+=`<article class="card"><h3 class="h2">Koulukohtainen osio</h3><div class="field"><label for="schoolMode">Sisältyykö hakukoulun kokeeseen?</label><select class="control" id="schoolMode"><option value="no" ${state.school?'':'selected'}>Ei / ei vielä vahvistettu</option><option value="yes" ${state.school?'selected':''}>Kyllä, 8 pisteen osio</option></select></div><p class="hint">Jos käytössä, koulukohtainen osio on pakollinen ja korvaa heikoimman kuudesta valtakunnallisesta testikokonaisuudesta. Varmista asia hakukoulusta.</p></article>`;
 html+=`<article class="card"><h3 class="h2">Varmuuskopioi tiedot</h3><p class="hint">Kaikki tulokset, tavoitteet, testipäivät, harjoitusmerkinnät ja harjoitteluaika tallentuvat vain tämän selaimen muistiin. GitHub ei saa henkilökohtaisia tuloksia. Varmuuskopio kannattaa ottaa säännöllisesti.</p><div class="row-actions"><button class="btn primary" id="exportBtn">Lataa JSON</button><button class="btn" id="importBtn">Palauta JSON</button></div><input type="file" class="hidden" id="importFile" accept=".json,application/json"></article>`;
 html+=`<article class="card"><h3 class="h2">Viralliset lähteet</h3><div class="row-item"><span>Suoritusohjeet, videot ja äänitteet</span><a href="${OFFICIAL}" target="_blank" rel="noopener">Avaa ↗</a></div><div class="row-item"><span>Pisteytys 2026–2027 (PDF)</span><a href="${TABLES}" target="_blank" rel="noopener">Avaa ↗</a></div><p class="hint">Sovellus on yksityinen harjoittelutyökalu, ei virallinen koejärjestelmä. Mahdolliset vuoden 2027 muutokset tarkistetaan ennen soveltuvuuskoetta.</p></article>`;
 el('view-settings').innerHTML=html;
}
function renderAll(){renderSessionSelect();renderHome();renderTests();renderProgress();renderPractice();renderSettings();updateTabs()}
function newSession(){const n=state.sessions.length+1;const name=prompt('Uuden testikerran nimi','Uusintatesti '+n);if(name===null)return;const trimmed=name.trim();if(!trimmed){alert('Anna testikerralle nimi.');return}const id=uid();state.sessions.push({id,name:trimmed.slice(0,70),date:dayKey(),results:{},notes:''});state.active=id;persist();tab='tests';selectedTest=null;catFilter='all';renderAll();window.scrollTo(0,0)}
function updateTestField(target){const t=tBy(target.dataset.test);if(!t)return;const field=t.fields.find(f=>f.key===target.dataset.field);if(!field)return;const val=target.value,where=target.dataset.scope==='current'?session().results:state.goals;
 if(!where[t.id])where[t.id]={};if(val==='')delete where[t.id][field.key];else where[t.id][field.key]=val;
 persist();refreshTestPreview();
}
function exportJson(){const data={app:'urhea-ellen',exportedAt:new Date().toISOString(),...state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='URHEA_Ellen_varmuuskopio_'+dayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500)}
async function importJson(file){if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!=='urhea-ellen'||x.version!==1||!Array.isArray(x.sessions)||!x.sessions.length||typeof x.goals!=='object')throw new Error('Tiedosto ei ole tämän sovelluksen varmuuskopio.');if(!confirm('Korvataanko nykyiset tulokset varmuuskopion tiedoilla? Toimintoa ei voi perua.'))return;state={...fresh(),...x,practice:(x.practice&&typeof x.practice==='object'&&!Array.isArray(x.practice))?x.practice:{}};if(!state.sessions.some(s=>s.id===state.active))state.active=state.sessions[0].id;persist();renderAll();alert('Varmuuskopio palautettu.')}catch(e){alert('Varmuuskopion avaaminen epäonnistui: '+e.message)}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){chooseTab(b.dataset.tab);return}
 if(b.dataset.practiceDay){choosePracticeDate(b.dataset.practiceDay);return}
 if(b.id==='practicePrev'){choosePracticeDate(shiftPracticeDay(practiceDate,-1));return}
 if(b.id==='practiceNext'){choosePracticeDate(shiftPracticeDay(practiceDate,1));return}
 if(b.id==='practiceToday'){choosePracticeDate(dayKey());return}
 if(b.id==='practiceClear'){if(checkedCount(practiceDate)===0)return;if(!confirm('Tyhjennet\u00e4\u00e4nk\u00f6 valitun p\u00e4iv\u00e4n harjoitusmerkinn\u00e4t?'))return;delete state.practice[practiceDate];persist();renderPractice();return}

 if(b.dataset.openCat){catFilter=b.dataset.openCat;tab='tests';selectedTest=null;renderAll();window.scrollTo(0,0);return}
 if(b.dataset.openTest){selectedTest=b.dataset.openTest;tab='tests';renderAll();window.scrollTo(0,0);return}
 if(b.dataset.backTests){selectedTest=null;renderAll();window.scrollTo(0,0);return}
 if(b.dataset.filter){catFilter=b.dataset.filter;renderTests();return}
 if(b.id==='newSessionTop'||b.id==='newSessionBtn'){newSession();return}
 if(b.id==='saveSessionMeta'){const name=el('sessionName').value.trim(),date=el('sessionDate').value;if(!name||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)){alert('Anna nimi ja kelvollinen päivämäärä.');return}const s=session();s.name=name;s.date=date;s.notes=el('sessionNotes').value;persist();renderAll();alert('Testikerran tiedot tallennettu.');return}
 if(b.id==='deleteSessionBtn'){if(state.sessions.length<2){alert('Viimeistä testikertaa ei voi poistaa.');return}if(!confirm('Poistetaanko valittu testikerta ja kaikki sen tulokset pysyvästi?'))return;state.sessions=state.sessions.filter(s=>s.id!==state.active);state.active=state.sessions.at(-1).id;persist();renderAll();return}
 if(b.id==='resetCompareBtn'){progressA=state.sessions[0].id;progressB=state.sessions[state.sessions.length-1].id;renderProgress();return}
 if(b.id==='exportBtn'){exportJson();return}
 if(b.id==='importBtn'){el('importFile').click();return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.scope){updateTestField(t);return}
 if(t.dataset&&t.dataset.effort){const n=numRaw(t.value);if(t.value.trim()==='')delete state.efforts[t.dataset.effort];else if(n!==null&&n>=0&&n<=10000)state.efforts[t.dataset.effort]=n;persist()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset?.practiceCheck){setPracticeCheck(t.dataset.practiceCheck,t.checked);return}
 if(t.id==='practiceDate'){choosePracticeDate(t.value);return}

 if(t.id==='activeSession'){state.active=t.value;persist();renderAll();return}
 if(t.id==='compareA'){progressA=t.value;renderProgress();return}
 if(t.id==='compareB'){progressB=t.value;renderProgress();return}
 if(t.id==='schoolMode'){state.school=t.value==='yes';persist();renderAll();return}
 if(t.id==='importFile'){importJson(t.files[0]);t.value='';return}
});
renderAll();
</script>
</body>
</html>
